<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智冷纪元 · 动画分镜</title>
  <meta name="description" content="《智冷纪元：AI重塑能效边界》11 镜头分镜动画 — AI+Power 设计系统暗色主题。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="player" id="player" data-tone="red">
    <div class="frame is-paused" id="frame">
      <div class="stage" id="stage">

        <header class="hud-top">
          <div class="brand">
            <span class="mark">AI</span>
            <b>AI+Power</b>
            <span class="sep">/</span>
            <span class="crumb">智冷纪元 · AI 重塑能效边界</span>
          </div>
        </header>

        <section class="titles" id="titles" aria-live="polite"></section>
        <div class="rule rule-top"></div>

        <section class="panel viz-panel">
          <div class="panel-head">
            <span class="p-kicker">02 · 画面 <b>VISUAL</b></span>
            <span class="p-kicker" id="vizMeta">SHOT 01 / 11 · 0:00–0:08</span>
          </div>
          <div class="viz-box" id="vizBox">
            <div class="viz" id="viz">
              <div class="viz-grid"></div>
              <!-- scenes are injected by scenes.js, before the brackets -->
              <i class="bracket tl"></i><i class="bracket tr"></i><i class="bracket bl"></i><i class="bracket br"></i>
            </div>
          </div>
          <div class="captions" id="captions"></div>
        </section>

        <aside class="panel side-panel">
          <div class="panel-head">
            <span class="p-kicker">03 · 旁白 <b>NARRATION</b></span>
            <span class="p-kicker">VO</span>
          </div>
          <div class="side-body">
            <div class="stack" id="narrStack"></div>
            <div class="side-rule"></div>
            <span class="p-kicker">04 · 知识点 <b>KEY POINT</b></span>
            <div class="stack" id="pointStack"></div>
            <div class="stack" id="metaStack"></div>
            <div class="pue">
              <span class="p-kicker">05 · 能效 <b>PUE LIVE</b></span>
              <b id="pueVal">1.85</b>
              <div class="bar"><i id="pueBar"></i></div>
            </div>
          </div>
        </aside>

      </div>
    </div>

    <div class="controls">
      <button class="btn icon" id="prevBtn" aria-label="上一镜头"><i class="ph ph-skip-back"></i></button>
      <button class="btn primary" id="playBtn"><i class="ph-fill ph-play"></i><span>播放</span></button>
      <button class="btn icon" id="nextBtn" aria-label="下一镜头"><i class="ph ph-skip-forward"></i></button>
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="时间轴 · 镜头" aria-valuemin="0" aria-valuemax="105" aria-valuenow="0">
        <div class="track" id="track"></div>
        <div class="head" id="head"></div>
        <div class="tip" id="tip"></div>
      </div>
      <span class="time mono" id="time">00:00 / 01:45</span>
      <button class="btn label-opt" id="liteBtn" aria-pressed="false" title="精简动效：只保留每个镜头的关键帧与淡入淡出"><i class="ph ph-person-simple-walk"></i><span>精简动效</span></button>
    </div>
    <p class="hint"><kbd>Space</kbd> 播放 / 暂停 · <kbd>←</kbd> <kbd>→</kbd> 逐镜头 · <kbd>Home</kbd> 回到开头 · 点击时间轴分段跳转镜头，拖动精确定位</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
  <script src="data.js"></script>
  <script src="scenes.js"></script>
  <script src="timeline.js"></script>
  <script src="player.js"></script>
</body>
</html>
